<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, user-scalable=yes">
    <title>Groupie-Tracker</title>
    <link rel="stylesheet" href="../css_style/css/artist.css">
</head>
<body>
    <div class="container">
        <div class="title"><a href="/">{{.Artist.Name}}</a></div>
        <div class="box">
            <div class="info">
                <h3>Members</h3>
                <ul class="members-list">
                    {{range .Artist.Members}}
                    <li>{{.}}</li>
                    {{end}}
                </ul>
                <h3>Date of Creation:</h3>
                <p>{{.Artist.CreationDate}}</p>
                <h3>First Album:</h3>
                <p>{{.Artist.FirstAlbum}}</p>
            </div>
            <div class="image-container">
                <img src="{{.Artist.Image}}" alt="">
            </div>
        </div>
        <div class="concert-info">
            <h3>Concert Dates</h3>
            <ul class="concert-list">
                {{range $i, $v := .Relation.DatesLocation}}
                <li>
                    <p class="city">{{$i}}</p>
                    <p class="dates">{{range $v}} {{.}} {{end}}</p>
                </li>
                {{end}}
            </ul>
        </div>
    </div>
</body>
</html>
