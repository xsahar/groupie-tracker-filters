<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, user-scalable=yes">
    <title>Groupie-Tracker</title>
    <style>
        /* CSS styles here */
        /* Reset default browser styles */
        html, body {
          margin: 0;
          padding: 0;
        }
        
        /* Set box-sizing to border-box for all elements */
        *, *::before, *::after {
          box-sizing: border-box;
        }
        
        /* Global styles */
        body {
          font-family: Arial, sans-serif;
          background-color: #f1f1f1;
          color: #333;
        }
        
        .title {
          text-align: center;
          margin-bottom: 20px;
        }
        
        .title h1 {
          font-size: 24px;
        }
        
        .container {
          display: flex;
          flex-wrap: wrap;
          margin: 20px;
        }
        
        .backHome {
          margin-bottom: 20px;
          color: #4CAF50;
          text-decoration: none;
          font-weight: bold;
        }
        
        .backHome:hover {
          text-decoration: underline;
        }
        
        .wrapper {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          margin-top: 20px;
        }
        
        .card {
          width: 250px; /* Increased card width */
          height: 350px; /* Increased card height */
          margin: 10px;
          background-color: #fff;
          border-radius: 5px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          overflow: hidden;
          transition: transform 0.3s;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        
        .card:hover {
          transform: scale(1.05);
        }
        
        .card a {
          text-decoration: none;
          color: inherit;
        }
        
        .card img {
          width: 100%;
          height: 250px; /* Adjusted image height */
          object-fit: cover;
        }
        
        .artist-name {
          font-weight: bold;
          color: #4CAF50; /* Change the color to your desired color */
          margin-top: 10px;
        }
        
        .nothingFound {
          text-align: center;
          margin-top: 50px;
          color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Groupie-Tracker</h1>
    </div> 
    <div class="container">
        <a href="/">
            <div class="backHome">&#8592; Back To Home</div>
        </a>
        {{if .Everyone}}
        <div class="wrapper wrap">
            {{range .Everyone}}
            <div class="card">
                <a href="/artists/?id={{.ID}}">
                    <img src="{{.Image}}" alt="{{.Name}}">
                    <div class="artist-name">{{.Name}}</div>
                </a>
            </div>
            {{end}}
        </div>
        {{else}}
        <h3 class="nothingFound">Nothing Found</h3>
        {{end}}
    </div>
</body>
</html>
