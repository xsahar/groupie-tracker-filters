<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="style1">
        <h1>Groupie Tracker</h1>
      <!-- Update the search form in your index.html template -->
<form action="/" method="get">
    <div class="input-wrapper">
        <input type="text" class="input" placeholder="Search.." name="search" value="{{.Query}}">
        <button type="submit"><i class="fa fa-search"></i></button>
    </div>
</form>

<!-- Modify the artist listing portion of the template to display filteredArtists -->
<div class="artistCards">
    {{range .Artists}}
    <div class="artistCard">
        <a href="/details/{{.ID}}">
            <img src="{{.Image}}" alt="{{.Name}} Image" class="artistImage">
        </a>
        <div class="artistName">
            <a href="/details/{{.ID}}">{{.Name}}</a>
        </div>
    </div>
    {{else}}
    <div class="noResults">
        No artists found.
    </div>
    {{end}}
</div>
