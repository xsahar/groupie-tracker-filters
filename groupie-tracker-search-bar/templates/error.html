<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="/style/main.css"> -->
    <title>{{.StatusCode}} {{.StatusText}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d3856;
            margin: 0;
            padding: 20px;
            color: #FFFFFF;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-top: 50px;
            color: #FFFFFF;
            -webkit-text-stroke: 2px #333333;
            -webkit-text-fill-color: #FFFFFF;
        }

        p {
            font-size: 24px;
            margin-top: 20px;
            line-height: 1.5;
        }

        a {
            font-size: 22px;
            text-decoration: none;
            display: inline-block;
            margin-top: 40px;
            padding: 12px 24px;
            border: 2px solid #FFFFFF;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            color: #FFFFFF;
        }

        a:hover {
            background-color: #FFFFFF;
            color: #333333;
        }

        img {
            max-width: 100%;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="errorName">{{.StatusCode}} {{.StatusText}}</h1>
        <p>{{.Description}}</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
